<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repositorios - Thiaguitochino</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Poppins, sans-serif;
            background: linear-gradient(
                135deg,
                #050816,
                #0d1024,
                #170d2e
            );
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(
                    circle at top,
                    #00ffe522,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom,
                    #8f00ff22,
                    transparent 45%
                );
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 40px;
        }

        header img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid cyan;
            box-shadow: 0 0 25px cyan;
            object-fit: cover;
        }

        h1 {
            margin-top: 20px;
            font-family: Orbitron, sans-serif;
            font-size: 45px;
            color: #00fff2;
            text-shadow: 0 0 15px cyan;
        }

        header p {
            opacity: .8;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(300px, 1fr)
            );
            gap: 30px;
            padding: 40px;
            max-width: 1400px;
            margin: auto;
        }

        .card {
            background: #10182bcc;
            border: 2px solid #00ffee55;
            border-radius: 20px;
            overflow: hidden;
            transition: .4s;
            box-shadow: 0 0 15px #000;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 25px cyan;
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .info {
            padding: 20px;
        }

        .info h2 {
            font-family: Orbitron, sans-serif;
            margin-bottom: 10px;
            color: #00ffe7;
            word-break: break-word;
        }

        .description {
            min-height: 70px;
            opacity: .8;
            line-height: 1.6;
        }

        .stats {
            margin-top: 12px;
            color: #b8ffff;
            font-size: 14px;
        }

        .language {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #00ffee22;
            border: 1px solid #00ffee55;
            color: #00ffe7;
            font-size: 13px;
        }

        .button-container {
            margin-top: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(
                90deg,
                #00ffee,
                #8f00ff
            );
            color: white;
            font-weight: bold;
            font-size: 15px;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 15px cyan;
        }

        a {
            text-decoration: none;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 50px;
            color: #00ffe7;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #ff6b6b;
        }

        footer {
            padding: 30px;
            text-align: center;
            opacity: .7;
        }

        @media (max-width: 600px) {

            header {
                padding: 30px 20px;
            }

            header img {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 32px;
            }

            .grid {
                padding: 20px;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>

        <!-- Avatar de GitHub de Thiaguitochino -->
        <img
            src="https://avatars.githubusercontent.com/u/201989891?v=4"
            alt="Thiaguitochino">

        <h1>THIAGUITOCHINO</h1>

        <p>Mis proyectos en GitHub</p>

    </header>

    <main>

        <div id="repos" class="grid">

            <div class="loading">
                Cargando repositorios...
            </div>

        </div>

    </main>

    <footer>
        Desarrollado con HTML • CSS • JavaScript 🚀
    </footer>


    <script>

        /*
         * Usuario de GitHub que queremos mostrar
         */
        const usuario = "thiaguitochino";


        /*
         * Contenedor donde aparecerán las tarjetas
         */
        const contenedor = document.getElementById("repos");


        /*
         * API de GitHub
         */
        const api = `https://api.github.com/users/${usuario}/repos?sort=updated&per_page=100`;


        /*
         * Obtener repositorios
         */
        fetch(api)

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "No se pudieron obtener los repositorios."
                    );
                }

                return response.json();

            })

            .then(repositorios => {

                /*
                 * Limpiamos "Cargando..."
                 */
                contenedor.innerHTML = "";


                /*
                 * Si no hay repositorios
                 */
                if (repositorios.length === 0) {

                    contenedor.innerHTML = `
                        <div class="error">
                            No se encontraron repositorios.
                        </div>
                    `;

                    return;
                }


                /*
                 * Crear una tarjeta por cada repositorio
                 */
                repositorios.forEach(repo => {

                    /*
                     * Imagen automática de GitHub.
                     *
                     * Cada repositorio tendrá su propia
                     * imagen de preview.
                     */
                    const imagen = `https://opengraph.githubassets.com/1/${repo.full_name}`;


                    /*
                     * Descripción
                     */
                    const descripcion =
                        repo.description ||
                        "Proyecto desarrollado por Thiaguitochino.";


                    /*
                     * Lenguaje
                     */
                    const lenguaje =
                        repo.language ||
                        "Sin especificar";


                    /*
                     * Crear tarjeta
                     */
                    const card = document.createElement("div");

                    card.className = "card";


                    card.innerHTML = `

                        <img
                            src="${imagen}"
                            alt="Vista previa de ${repo.name}"
                            loading="lazy"
                        >

                        <div class="info">

                            <h2>
                                ${repo.name}
                            </h2>

                            <p class="description">
                                ${descripcion}
                            </p>

                            <p class="stats">
                                ⭐ ${repo.stargazers_count}
                                &nbsp; | &nbsp;
                                🍴 ${repo.forks_count}
                            </p>

                            <span class="language">
                                ${lenguaje}
                            </span>

                            <div class="button-container">

                                <a
                                    href="${repo.html_url}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    <button>
                                        Ver repositorio
                                    </button>

                                </a>

                            </div>

                        </div>
                    `;


                    /*
                     * Agregar tarjeta al sitio
                     */
                    contenedor.appendChild(card);

                });

            })

            .catch(error => {

                console.error(error);

                contenedor.innerHTML = `

                    <div class="error">

                        <h2>
                            No se pudieron cargar los repositorios
                        </h2>

                        <p>
                            Verificá tu conexión a Internet
                            e intentá nuevamente.
                        </p>

                    </div>

                `;

            });

    </script>

</body>

</html>
